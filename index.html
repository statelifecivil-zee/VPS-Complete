*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,Helvetica,sans-serif;background:#f6f7f9;color:#1b2a4a;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 20px 40px}
.logo{width:104px;height:104px;border-radius:50%;background:#fff;box-shadow:0 8px 28px rgba(27,42,74,.12);display:flex;align-items:center;justify-content:center;margin-bottom:26px}
.logo svg.mark{width:68px;height:68px}
.brand{text-align:center;margin-bottom:8px}
.brand h1{font-size:2rem;font-weight:800;letter-spacing:3px;color:#14243f}
.brand p{font-size:.8rem;letter-spacing:3.5px;color:#1b7fc1;font-weight:700;margin-top:8px}
.divider{width:min(560px,90%);height:1px;background:#dfe4ec;margin:26px 0}
h2{font-size:1.45rem;font-weight:800;letter-spacing:1.5px;color:#2a3b5c;text-align:center;margin-bottom:44px}
.cards{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.card{background:#fff;border:1px solid #e8ecf2;border-radius:22px;box-shadow:0 6px 22px rgba(27,42,74,.07);width:220px;padding:44px 20px 36px;text-align:center;text-decoration:none;color:inherit;transition:transform .16s ease,box-shadow .16s ease}
.card:hover{transform:translateY(-5px);box-shadow:0 14px 32px rgba(27,42,74,.13)}
.card .pic{width:72px;height:72px;border-radius:20px;margin:0 auto 22px;display:flex;align-items:center;justify-content:center}
.card.islamic .pic{background:#e6f6ee}
.card.conventional .pic{background:#e8f0fd}
.card .pic svg{width:38px;height:38px}
.card.islamic .pic svg{fill:#0e9b5f}
.card.conventional .pic svg{fill:#2f6fd0}
.card h3{font-size:.98rem;font-weight:700;color:#2a3b5c;line-height:1.45}
@media(max-width:560px){
  .cards{gap:18px}
  .card{width:160px;padding:34px 14px 28px}
  h2{font-size:1.15rem}
}
</style>
